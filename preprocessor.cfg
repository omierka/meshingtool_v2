[3DMeshGen]

[MeshAnalysis]
axis_alignment_epsilon = 1.0e-4  # report --geo-round-analysis: abs(x_c), abs(y_c) must both stay within this
preprocessing_export_precision = 2  # decimals used for BarrelDiameter/InnerDiameter/BarrelLength/AxialStartPosition and sEl defaults
preprocessing_sel_tangential = 1.25  # default sEl_Tangential written into [E3DGeometryData/Preprocessing]
preprocessing_sel_radial = 0.80  # default sEl_Radial written into [E3DGeometryData/Preprocessing]
preprocessing_sel_axial = 1.25  # default sEl_Axial written into [E3DGeometryData/Preprocessing]
preprocessing_fullcylinderperiodicity = 4  # default FullCylinderPeriodicity written for FullCylinder preprocessing
preprocessing_sel_x = 1.0  # default sEl_x written into [E3DGeometryData/Preprocessing] for Box
preprocessing_sel_y = 1.0  # default sEl_y written into [E3DGeometryData/Preprocessing] for Box
preprocessing_sel_z = 1.0  # default sEl_z written into [E3DGeometryData/Preprocessing] for Box

[3DMeshCleaner]
cylinder_boundary_tolerance_factor = 0.90  # tolerance = factor * min_edge_length
box_boundary_tolerance_factor = 0.50  # tolerance = factor * min_edge_length
tolerance_floor = 1.0e-12  # eps = max(tolerance, tolerance_floor) for inflow matching
inflowcos_threshold_orientation_ = 0.95  # |dot(n_face, n_inflow)| must exceed this to match

[2DMeshAnalysis]
[2DMeshAnalysis/MingapValidity]
neighbor_diameter_ratio_flag = 2.0  # neighbours must be >2× larger to flag validity=2
neighbor_normal_angle_limit_deg = 60.0  # >60° difference flags validity=3
small_angle_limit_deg = 4.0  # triangles with <4° interior angle flagged with validity=4
[2DMeshAnalysis/MingapScore]
relative_min_search_radius = 0.005  # minimum topological search radius relative to mesh size
dihedral_angle_threshold_rad = 0.3  # gaps with dihedral <0.3 treated as perfect
face_aspect_ratio_limit = 5.0  # candidate gaps require ratio below this for both faces
edge_ratio_limit = 5.0  # limit on max_edge_length ratio between face and limiting face
min_diameter_fraction = 1.0e-4  # discard MIS hits below this fraction of mesh size
gap_score_threshold = 0.95  # preferred minimum gap score for candidate list
score_percentile_fallback = 0.10  # if no score >0.95, take top 10% instead
similarity_of_normals_score = "pow(-similarity, 1/3) when MIS normals oppose"
[2DMeshAnalysis/MingapDesign]
monitor_histogram_base = 3.0  # logarithmic histogram uses factor-of-3 bins
monitor_histogram_eps = 1.0e-12  # epsilon used when building histogram bins
histogram_target_fraction = 0.001  # 0.1% weighted area for adjusted min-gap cutoff
histogram_min_fraction_threshold = 0.001  # used to place MIN bin
histogram_max_fraction_threshold = 0.660  # coverage cap for MAX bin
max_histogram_span_bins = 3  # histogram span clamped to <=3 bins
min_histogram_span_bins = 1  # histogram span always >=1 bin
coarse_mesh_scaling = 1.50  # multiplier used to convert mindist/span into coarse-mesh size

[3DMeshRef]
monitor_threshold_default = 1.25  # Monitor_threshold initial value (CLI enforces >=0)
FullCylinderMinRadiusPercentage = 10.0  # blend ratio below this % of BarrelDiameter leans fully to box mapping
FullCylinderMaxRadiusPercentage = 20.0  # blend ratio above this % of BarrelDiameter uses pure annular mapping

[3DMonitorGen]
triangle_tree_tol = 1.0e-12  # tolerance used while clipping/point-in tests
clip_eps = 1.0e-12  # repeated epsilon guards inside TRIvsTET

[3DMeshDeform]
deformation_steps = 4        # number of umbrella iterations applied per run
characteristic_scale = 100.0 # scaling constant for the characteristic size ratio

[Driver]
monitor_zero_bin_threshold_percent = 1.0e0  # trigger 2nd iteration when first volume-histogram bin (in %)  <= value
